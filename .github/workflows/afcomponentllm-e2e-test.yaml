---
name: af-component-llm E2E
# ─────────────────────────────────────────────────────────────────────────────
# NO PATH FILTER, DELIBERATELY. This used to fire only on `template/**`,
# `tests/**`, the Taskfile, and the two dependency files. It now runs on every
# push and every pull request to main.
#
# Two reasons. The repo is small and its traffic is low, so the runner cost of
# the filter was never really being saved. And the suite that actually proves
# this component works is the one that deploys it, so a change that looked
# unrelated to the filter but broke a render reached main unverified. That has
# happened here more than once.
#
# It also makes `E2E gate` below listable. A skipped job reports NO status at
# all, which is why a path-filtered workflow can never be a required check or
# an automerge `expected_checks` entry: the pull request waits forever on a
# context that will never arrive. With the filter gone, the gate job reports on
# every pull request, so `.github/automerge.yaml` can require a green E2E
# before a Dependabot bump merges unattended.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel mid-deploy — risks orphaned DataRobot resources.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  e2e:
    name: "E2E / ${{ matrix.configuration }}"
    # Skip fork PRs so integration secrets are not exposed to untrusted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: "ubuntu-latest"
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: gateway_direct
            task: test-e2e:gateway-direct
          - configuration: blueprint_with_llm_gateway
            task: test-e2e:blueprint-with-llm-gateway
          - configuration: deployed_llm
            task: test-e2e:deployed-llm
          - configuration: blueprint_with_external_llm
            task: test-e2e:blueprint-with-external-llm
          - configuration: registered_model
            task: test-e2e:registered-model
    env:
      PULUMI_STACK: ${{ github.ref == 'refs/heads/main' && format('e2e-test-llm-{0}-run-{1}', matrix.configuration, github.run_id) || format('pr-e2e-test-llm-{0}-run-{1}', matrix.configuration, github.run_id) }}
    container:
      image: ghcr.io/astral-sh/uv:python3.11-bookworm
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        with:
          python-version: python3.11
          cache-key-suffix: e2e-${{ matrix.configuration }}
      - name: Install pulumi
        shell: bash
        env:
          PULUMI_VERSION: "3.249.0"
          PULUMI_SHA256: "0c4acfac957f578e406a3ae9f7042c57f05c4ad9e4b1c83ba0fcf3395e2a0b74"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          tarball="pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "${workdir}/${tarball}" \
            "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/${tarball}"
          echo "${PULUMI_SHA256} ${workdir}/${tarball}" | sha256sum -c -
          tar -xzf "${workdir}/${tarball}" -C "${workdir}"
          echo "${workdir}/pulumi" >> "$GITHUB_PATH"
      - name: Run E2E
        shell: bash
        env:
          UV_CACHE_DIR: /.uv_cache
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
          LLM_DEFAULT_MODEL: ${{ secrets.LLM_DEFAULT_MODEL }}
          LLM_DEPLOYMENT_ID: ${{ secrets.LLM_DEPLOYMENT_ID }}
          TEXTGEN_REGISTERED_MODEL_ID: ${{ secrets.TEXTGEN_REGISTERED_MODEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_API_DEPLOYMENT_ID: ${{ secrets.OPENAI_API_DEPLOYMENT_ID }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
        run: |
          set -euo pipefail
          uvx --from go-task-bin task ${{ matrix.task }} 2>&1 | tee "e2e-${{ matrix.configuration }}.log"
      - name: Tear down E2E resources
        if: always()
        shell: bash
        env:
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        run: |
          set -euo pipefail
          stack="${PULUMI_STACK}"
          rendered=".rendered"
          infra="${rendered}/infra"
          if [ ! -d "$infra" ]; then
            echo "No rendered infra dir for ${stack}; nothing to clean."
            exit 0
          fi
          export PULUMI_CONFIG_PASSPHRASE=123
          export PULUMI_HOME="${rendered}/.pulumi_home"
          export PULUMI_STACK="${stack}"
          export DATAROBOT_ENDPOINT
          export DATAROBOT_API_TOKEN
          set -x
          (cd "$infra" && uv run pulumi login --local) || true
          (cd "$infra" && uv run pulumi cancel --yes --stack "$stack") || true
          (cd "$rendered" && uvx --from go-task-bin task -t Taskfile.yml destroy -- --yes --skip-preview) || true
          (cd "$infra" && uv run pulumi stack rm -f -y "$stack") || true
      - name: Upload E2E logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-${{ matrix.configuration }}.log
            ./.rendered/**/*.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # The one context anything else is allowed to depend on.
  #
  # `E2E / <configuration>` is five separate check runs whose names change
  # whenever the matrix does, so nothing outside this file should name them.
  # This job collapses all five into one stable context, and because it is
  # `if: always()` it reports on every pull request rather than only on the
  # ones where the matrix ran. That is what makes it listable in
  # `.github/automerge.yaml` and eligible to be a required status check.
  #
  # `needs.e2e.result` is the AGGREGATE across the whole matrix: `success` only
  # when every leg succeeded, `failure` if any leg failed, `skipped` when the
  # matrix job did not run at all.
  #
  # Skipped counts as a pass, and that is not laziness. The `e2e` job skips on
  # exactly one condition: a pull request from a fork, where the integration
  # secrets are deliberately withheld. Failing here would turn every fork
  # contribution permanently red for a suite it is not allowed to run. Those
  # pull requests are reviewed by a human by definition, and the same commits
  # run the full suite on the push to main after the merge.
  #
  # Cancelled is a failure. A cancelled deploy is the case most likely to have
  # left DataRobot resources behind, so it must never read as green.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-gate:
    name: "E2E gate"
    if: always()
    needs: [e2e]
    runs-on: "ubuntu-latest"
    steps:
      - name: Report the aggregate E2E result
        shell: bash
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "E2E matrix result: ${E2E_RESULT}"
          case "${E2E_RESULT}" in
            success)
              echo "All E2E configurations passed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              echo "E2E did not run (fork pull request; integration secrets withheld)." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::E2E matrix reported '${E2E_RESULT}'."
              echo "E2E matrix reported \`${E2E_RESULT}\`. See the per-configuration jobs." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
