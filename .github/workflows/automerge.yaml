name: Automerge

# ─────────────────────────────────────────────────────────────────────────────
# Automerge
# Approves and merges Dependabot's grouped github-actions bump once every check
# in `.github/automerge.yaml` has reported green.
#
# Why this rather than `gh pr merge --auto`: ruleset bypass resolves against
# whoever PERFORMS the merge. Native auto-merge merges as `github-actions[bot]`,
# which holds no bypass and cannot be given one (bypass actors must be Apps
# installed on the repo, and Actions is built in). The PR would sit waiting on a
# code-owner review forever, with auto-merge armed and nothing saying why. This
# merges as the `dr-auto-merge` App instead, which does hold the bypass on the
# `main review` ruleset.
#
# It also adds what native auto-merge cannot do: native auto-merge waits only on
# REQUIRED checks, and `main` requires three contexts here. `expected_checks` in
# `.github/automerge.yaml` is the rest of the bar, and `E2E gate` is the entry
# that matters.
# ─────────────────────────────────────────────────────────────────────────────
# MODE:
#   report  - comments a verdict, approves and merges nothing.
#   approve - also approves. The merge is still a human click.
#   merge   - also approves AND merges.
#
# Landed directly in `merge`, after af-component-evaluation validated the same
# workflow through report mode on 2026-09-11 and af-component-agent followed.
# Even in `merge` the approval and the merge happen on DIFFERENT polls, so there
# is always a window of roughly one poll interval to intervene. Dropping back to
# `report` is a one-word revert if anything looks wrong.
# ─────────────────────────────────────────────────────────────────────────────
# A cron, not `pull_request`: a Dependabot `pull_request` event cannot read this
# repo's Actions secrets, so the App key would arrive empty. Polling also
# self-heals when GitHub drops a workflow dispatch, and makes "wait for the
# checks to finish" free. That last point is worth more here than in the sibling
# repos, because the checks being waited on include an hour of live deploys.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  automerge:
    uses: datarobot-oss/github-actions/.github/workflows/automerge.yaml@0.0.29
    with:
      # Public metadata, not a secret: `dr-auto-merge`.
      app_id: '4912188'
      mode: 'merge'
    secrets:
      app_private_key: ${{ secrets.DR_AUTO_MERGE_PRIVATE_KEY }}
    permissions:
      contents: read
