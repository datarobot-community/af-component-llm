# ─────────────────────────────────────────────────────────────────────────────
# Automerge policy.
#
# The presence of this file is what enrols the repo. Delete it and automerge
# stops, with no workflow edit needed.
#
# It is always read from the DEFAULT BRANCH, never from a PR head, so a pull
# request cannot ship a policy that grants itself permission to be merged.
#
# See docs/AUTOMERGE.md in datarobot-oss/github-actions for the full picture,
# and note the one rule that matters: the ruleset is the enforcer, this file is
# an EXTRA gate on top of it. `main` carries required_status_checks with an
# empty bypass list, so nothing here can cause a failing PR to merge.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Only Dependabot for now. cve-sync opens its PRs as the `cve-sync` App, and it
# will be added here once this has run unattended for a while: one bot at a
# time, so a surprise has an obvious source.
allowed_authors:
  - dependabot[bot]

label: automerge

# ─────────────────────────────────────────────────────────────────────────────
# Each of these must be PRESENT and green. Not "not failing": present. A PR
# where a suite never ran at all is refused.
#
# The contexts `main`'s rulesets already require are added automatically from
# the branch rules API, so this list does not have to repeat them. The three it
# requires today are repeated anyway, deliberately: if someone edits the ruleset
# and drops one, this file still holds the line.
#
# `E2E gate` IS THE POINT OF THIS LIST. It is the only check that proves the
# component still deploys, and it is listable here only because
# afcomponentllm-e2e-test.yaml had its path filter removed and grew an
# `if: always()` gate job. A path-filtered suite reports no status at all when
# it skips, so listing one wedges every pull request forever. Read the header of
# that workflow before putting the filter back: doing so silently breaks this.
#
# Expect a merge to take the better part of an hour, because the E2E matrix
# deploys five real configurations against a live DataRobot and this waits for
# all of them.
#
# DELIBERATELY ABSENT:
# - `E2E / <configuration>` — the five matrix legs. Their names change with the
#                             matrix; `E2E gate` is the stable alias for them.
# - `Create Release`        — runs on push to main, not on pull_request.
# - `backport`              — runs on closed PRs.
# ─────────────────────────────────────────────────────────────────────────────
expected_checks:
  - "E2E gate"
  - "Test Infra (gateway_direct)"
  - "Test Infra (registered_model)"
  - "Test Infra (blueprint_with_llm_gateway)"
  - "Test Infra (deployed_llm)"
  - "Test Infra (blueprint_with_external_llm)"
  - "Test License"
  - "Check for Windows-incompatible file paths"
  - "gate / cve-sync gate"

# Refuse when ANY check is failing, including ones neither required nor listed.
# `skipped` and `neutral` count as a pass.
block_on_any_failure: true

settle_seconds: 300

# A grouped github-actions bump touches one file per workflow that pins an
# action. That is 10 workflows plus the two composite actions under
# `.github/actions/`, so 12 is the realistic ceiling today and 16 leaves room
# for a few more. Anything much larger is not the PR we think it is.
max_changed_files: 16

# ─────────────────────────────────────────────────────────────────────────────
# Only the github-actions ecosystem is automerged here, so a PR touching
# anything outside `.github/` is by definition not the PR this policy is for.
#
# `pyproject.toml` and `uv.lock` are NOT listed, and that is load-bearing rather
# than an oversight. Dependabot's Python PRs are labelled `00 - Ready for
# Review` instead of `automerge`, so they never reach this policy in the normal
# course. If somebody hand-labels one `automerge` anyway, this list refuses it
# and escalates rather than merging a datarobot-genai bump unattended.
#
# `.github/actions/**` matters: the composite actions pin their own
# dependencies (setup-caching pins `actions/cache`) and Dependabot bumps them in
# the same grouped PR.
# ─────────────────────────────────────────────────────────────────────────────
allowed_paths:
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/dependabot.yml"

# `main review` allows squash only; any other method is refused by GitHub.
merge_method: squash

# ─────────────────────────────────────────────────────────────────────────────
# What happens when automerge gives up.
#
# Transient refusals (checks still running, settling, branch behind base) just
# wait for the next poll. Terminal ones do not: a red check never goes green on
# its own, and a PR touching files outside `allowed_paths` never will.
#
# On a terminal refusal the bot drops the `automerge` label, applies the label
# below, and posts a new comment explaining why. Dropping `automerge` is what
# makes that happen exactly once: the PR stops being a candidate.
#
# `00 - Ready for Review` puts the PR into the normal review queue. Because the
# label is applied with the App token rather than GITHUB_TOKEN, it also triggers
# workflow-pr-automation.yaml's Slack ping, so somebody actually hears about it.
# ─────────────────────────────────────────────────────────────────────────────
escalate_label: "00 - Ready for Review"
