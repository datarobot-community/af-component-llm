# ─────────────────────────────────────────────────────────────────────────────
# Automerge policy for dr-auto-merge.
#
# The presence of this file enrols the repo; delete it and automerge stops, with
# no workflow edit. It is always read from the DEFAULT BRANCH, so a pull request
# cannot ship a policy that grants itself permission to be merged.
#
# The ruleset is the enforcer, this file is an EXTRA gate on top of it. `main`
# carries required_status_checks with an empty bypass list, so nothing here can
# cause a failing PR to merge.
#
# Reference: docs/AUTOMERGE.md in datarobot-oss/github-actions.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Spelled with the `[bot]` suffix, exactly. Authors are compared with no
# normalization, and a mismatch is SILENT: the PR is not a candidate at all, so
# it gets no comment and no hand-over.
#
allowed_authors:
  - dependabot[bot]

label: automerge

# Each context must be PRESENT and green. Not "not failing": present. A PR where
# a suite never ran at all is refused.
#
# Contexts the rulesets already require are added automatically from the branch
# rules API. The three `main` requires today are repeated anyway, deliberately:
# if someone edits the ruleset and drops one, this file still holds the line.
#
# `E2E gate` is the point of this list. It is the only check that proves the
# component still deploys, and it is listable only because
# afcomponentllm-e2e-test.yaml has no path filter and grew an `if: always()`
# gate job. A path-filtered suite reports no status at all when it skips, so
# listing one wedges every PR forever; read that workflow's header before
# putting the filter back.
#
# On DEPENDABOT PRs it holds the slot rather than proving anything. Those events
# cannot read this repo's Actions secrets, so the E2E matrix is skipped and the
# gate reports green without having deployed. Restoring the proof is a settings
# change: mirror the nine E2E secrets into the Dependabot secret store and drop
# the actor check in afcomponentllm-e2e-test.yaml.
#
# Deliberately absent: `E2E / <configuration>` (leg names move with the matrix,
# `E2E gate` is their stable alias), `Create Release` (push to main, not
# pull_request), `backport` (closed PRs).
expected_checks:
  - "E2E gate"
  - "Test Infra (gateway_direct)"
  - "Test Infra (registered_model)"
  - "Test Infra (blueprint_with_llm_gateway)"
  - "Test Infra (deployed_llm)"
  - "Test Infra (blueprint_with_external_llm)"
  - "Test License"
  - "Check for Windows-incompatible file paths"

# Refuse when ANY check is failing, including ones neither required nor listed.
# `skipped` and `neutral` count as a pass.
block_on_any_failure: true

# Cursor Bugbot reports through a review comment rather than a check, so without
# this flag its findings are decorative: a PR can carry a high-severity finding
# and still merge itself with everything green. Only OPEN threads block;
# resolving the conversation, or changing the code so the thread goes outdated,
# clears it.
block_on_cursor_comments: true

# Quiet time required after the last check completes, measured from the check
# timestamps. Its real job is catching a workflow that has not reported yet.
settle_seconds: 300

# Sized for a grouped github-actions bump: 10 workflows plus the two composite
# actions under `.github/actions/`, so 16 leaves room.
max_changed_files: 16

# What Dependabot's grouped github-actions bump touches. `.github/actions/**`
# matters because the composite actions pin their own dependencies
# (setup-caching pins `actions/cache`).
#
# `pyproject.toml` and `uv.lock` are deliberately absent: a Dependabot Python PR
# that somebody hand-labelled `automerge` is refused.
allowed_paths:
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/dependabot.yml"

# `main review` allows squash only; any other method is refused by GitHub.
merge_method: squash

# Terminal refusals (a failed check, a file outside `allowed_paths`, an open
# Bugbot thread) drop the `automerge` label, apply this one, and post a NEW
# comment saying why. Transient ones (checks running, settling, branch behind
# base) just wait for the next poll. Dropping `automerge` first is what makes
# the hand-over happen exactly once.
#
# `00 - Ready for Review` puts the PR in the normal review queue. The label is
# applied with the App token rather than GITHUB_TOKEN, so it also triggers
# workflow-pr-automation.yaml's Slack ping.
escalate_label: "00 - Ready for Review"
