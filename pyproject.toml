[project]
name = "af-component-llm"
version = "0.1.0"
description = "DataRobot App Framework LLM component (Copier template + E2E harness)."
requires-python = ">=3.11, <3.14"
dependencies = []

[project.optional-dependencies]
e2e = [
    "pytest>=7.4.0",
    "datarobot>=3.10.0,<4.0.0",
    "datarobot-genai[crewai,langgraph,llamaindex]>=0.29.42",
]

[tool.uv]
# cve-sync:begin
# cve-sync:waived chromadb>1.5.9 NOT applied -- no-upstream-fix, expires 2026-12-09
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "authlib>=1.7.1",
    "banks>=2.4.5",
    "crewai-tools>=1.15.21",
    "idna>=3.15",
    "joserfc>=1.6.8",
    "langchain>=1.3.9",
    "langchain-classic>=1.0.7",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint>=4.1.1",
    "langsmith>=0.8.18",
    "nltk>=3.10.3",
    "openai>=2.30.0",
    "pdfminer.six>=20251230",
    "pillow>=12.3.0",
    "pip>=26.2",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pypdf>=6.16.1",
    "pytest>=9.0.3",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.9.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
