[project]
name = "af-component-llm"
version = "0.1.0"
description = "DataRobot App Framework LLM component (Copier template + E2E harness)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
e2e = [
    "pytest>=7.4.0",
    "datarobot>=3.10.0,<4.0.0",
    "datarobot-genai[crewai,langgraph,llamaindex]>=0.24.2",
]

[tool.uv]
override-dependencies = [
    "litellm>=1.91.1,<2.0.0",
    # crewai pin otel to 1.34.x; override the family to stay synchronized at 1.43.x / 0.64b0
    "opentelemetry-api>=1.43.0,<2.0.0",
    "opentelemetry-sdk>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-common>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0,<2.0.0",
    "opentelemetry-instrumentation>=0.64b0,<0.65",
]

[tool.pytest.ini_options]
markers = [
    "e2e: tests that call live LLM endpoints (require RUN_E2E=1 and DataRobot credentials).",
]
testpaths = ["tests/e2e"]
