override-dependencies = [
    "aiofiles>=25.1,<26",
    "click>=8.3.3",
    "crewai>=1.15.21",
    "cryptography>=50.0.0",
    "json-repair>=0.60.1",
    "litellm>=1.91.1,<2.0.0",
    "mcp>=1.28.1,<2",
    "opentelemetry-api>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-common>=1.43.0,<2.0.0",
